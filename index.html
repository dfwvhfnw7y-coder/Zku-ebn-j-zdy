<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zkušební jízdy — S. & W. Automobily</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0f1e;--card:#111827;--card2:#1a2236;--border:#1e3050;--text:#e4eaf4;--text2:#8899b4;--accent:#00c9a7;--red:#ff4d6a;--blue:#3b82f6;--radius:12px;--font:-apple-system,'SF Pro Text','Segoe UI',system-ui,sans-serif}
html,body{background:var(--bg);font-family:var(--font);color:var(--text);min-height:100vh;min-height:100dvh;max-width:520px;margin:0 auto;overflow-x:hidden}
body{padding-bottom:80px}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:20}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:-.02em}
.hdr .badge{margin-left:auto;font-size:11px;background:var(--accent);color:#000;padding:2px 8px;border-radius:20px;font-weight:700}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:53px;z-index:19}
.tab{flex:1;text-align:center;padding:11px 0 9px;font-size:12px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;cursor:pointer;transition:.2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.toast{position:fixed;top:110px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);color:var(--accent);padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:200;box-shadow:0 4px 24px rgba(0,201,167,.15);white-space:nowrap;display:none;animation:fadeIn .3s}
.toast.warn{color:var(--red);border-color:var(--red)}
.toast.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.panel{display:none;padding:16px}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:var(--radius);font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-accent{background:var(--accent);color:#000}
.btn-blue{background:var(--blue);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:10px 16px;font-size:13px;width:auto}
.inp{width:100%;padding:12px 14px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font:inherit;font-size:15px;outline:none}
.inp:focus{border-color:var(--accent)}.inp::placeholder{color:var(--text2)}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;max-width:360px;width:100%;text-align:center;animation:popIn .25s}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.confirm-box .icon{font-size:48px;margin-bottom:12px}
.confirm-box .label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.confirm-box .value{font-size:22px;font-weight:700;margin-bottom:6px;word-break:break-word}
.confirm-box .info{font-size:13px;color:var(--text2);margin-bottom:16px}
.confirm-box .btns{display:flex;gap:10px}
.confirm-box .btns .btn{flex:1}
.active-tag{display:inline-block;font-size:11px;background:rgba(0,201,167,.15);color:var(--accent);padding:2px 8px;border-radius:20px;margin-top:6px;font-weight:700;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.active-card{background:var(--card);border:2px solid var(--accent);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.active-card .top{display:flex;justify-content:space-between;align-items:center}
.active-card .car{font-size:16px;font-weight:700}
.active-card .end-btn{background:none;border:1px solid var(--red);color:var(--red);font:inherit;font-size:12px;font-weight:600;padding:4px 12px;border-radius:8px;cursor:pointer}
.active-card .end-btn:active{background:var(--red);color:#fff}
.ride{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.ride .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.ride .car{font-size:16px;font-weight:700}
.ride .time{font-size:12px;color:var(--text2)}
.ride .customers{font-size:13px;color:var(--text2);line-height:1.6}
.ride .customers span{color:var(--accent);font-weight:600}
.ride .dur{display:inline-block;font-size:11px;background:var(--card2);padding:2px 8px;border-radius:20px;margin-top:6px;color:var(--text2)}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.qr-block{text-align:center;margin:16px 0}
.qr-label{font-size:13px;color:var(--text2);margin-top:8px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}}

/* Scanner overlay */
.scan-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
.scan-overlay.show{display:flex}
.scan-top{display:flex;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);z-index:2}
.scan-top .label{flex:1;text-align:center;font-size:15px;font-weight:700}
.scan-cancel{background:none;border:none;color:var(--accent);font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:8px}
#scanReader{flex:1;width:100%}
/* Restyle html5-qrcode built-in UI */
#scanReader video{object-fit:cover!important}
#scanReader__dashboard_section_csr button{
  background:var(--accent)!important;color:#000!important;border:none!important;
  padding:10px 20px!important;border-radius:8px!important;font-weight:700!important;
  font-size:14px!important;margin:4px!important
}
#scanReader__dashboard_section_csr select{
  background:var(--card2)!important;color:var(--text)!important;border:1px solid var(--border)!important;
  padding:8px!important;border-radius:8px!important;font-size:14px!important;margin:4px!important
}
#scanReader__dashboard_section_csr span,
#scanReader__dashboard_section_csr a{color:var(--text2)!important;font-size:12px!important}
#scanReader__dashboard_section_fsr{display:none!important}
#scanReader__header_message{color:var(--text2)!important;font-size:12px!important}
#scanReader img[alt="Info"]{display:none!important}
#scanReader__scan_region{background:#000!important}
</style>
</head>
<body>
<div class="hdr"><h1>🚗 Zkušební jízdy</h1><span class="badge" id="countBadge">0</span></div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('scan')" id="tabScan">Jízdy</div>
  <div class="tab" onclick="switchTab('gen')" id="tabGen">QR kódy</div>
  <div class="tab" onclick="switchTab('log')" id="tabLog">Historie</div>
</div>
<div id="toast" class="toast"></div>

<!-- SCANNER OVERLAY -->
<div id="scanOverlay" class="scan-overlay">
  <div class="scan-top">
    <button class="scan-cancel" onclick="closeScan()">✕ Zavřít</button>
    <div class="label" id="scanLabel">Skenuj QR</div>
    <div style="width:60px"></div>
  </div>
  <div id="scanReader"></div>
</div>

<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <div class="icon" id="cfIcon"></div>
    <div class="label" id="cfLabel"></div>
    <div class="value" id="cfValue"></div>
    <div class="info" id="cfInfo"></div>
    <div class="btns">
      <button class="btn btn-outline" onclick="hideConfirm()">Zrušit</button>
      <button class="btn btn-accent" id="cfOkBtn" onclick="confirmAction()">Zapsat</button>
    </div>
  </div>
</div>

<!-- TAB: JÍZDY -->
<div id="panelScan" class="panel active">
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="btn btn-accent" onclick="startScan('car')" style="flex:1">🚗 Skenovat auto</button>
    <button class="btn btn-blue" onclick="startScan('customer')" style="flex:1">👤 Skenovat zákazníka</button>
  </div>
  <div id="activeSection"></div>
  <div class="card">
    <h3>Ruční zadání</h3>
    <div style="margin-bottom:8px"><input class="inp" id="manualCar" placeholder="Vůz (např. GLC 300d 4M)"></div>
    <div style="margin-bottom:12px"><input class="inp" id="manualCust" placeholder="Zákazník (jméno)"></div>
    <button class="btn btn-outline" onclick="manualAdd()">Zapsat ručně</button>
  </div>
</div>

<!-- TAB: QR -->
<div id="panelGen" class="panel">
  <div class="card">
    <h3>🚗 QR — vozidlo</h3>
    <input class="inp" id="genCarInput" placeholder="Např. GLC 300d 4MATIC AB1C2DE" style="margin-bottom:12px">
    <button class="btn btn-accent" onclick="generateQR('car')">Vytvořit QR</button>
    <div id="qrCarOutput" style="display:none"><div class="qr-block"><div id="qrCarContainer"></div><div class="qr-label" id="qrCarName"></div></div>
    <button class="btn btn-outline btn-sm" onclick="printQR('car')" style="margin:0 auto;display:flex;width:auto">🖨</button></div>
  </div>
  <div class="card">
    <h3>👤 QR — zákazník</h3>
    <input class="inp" id="genCustInput" placeholder="Např. Jan Novák" style="margin-bottom:12px">
    <button class="btn btn-accent" onclick="generateQR('customer')">Vytvořit QR</button>
    <div id="qrCustOutput" style="display:none"><div class="qr-block"><div id="qrCustContainer"></div><div class="qr-label" id="qrCustName"></div></div>
    <button class="btn btn-outline btn-sm" onclick="printQR('customer')" style="margin:0 auto;display:flex;width:auto">🖨</button></div>
  </div>
  <div class="card">
    <h3>ℹ️ Návod</h3>
    <div style="font-size:13px;color:var(--text2);line-height:1.7">
      <b>V appce:</b> Skenovat → vyber kameru → namiř na QR<br>
      <b>Fotoaparátem:</b> Namiř na QR → klepni na odkaz<br><br>
      Opakovaný sken = ukončí jízdu · Více aut současně
    </div>
  </div>
</div>

<!-- TAB: LOG -->
<div id="panelLog" class="panel">
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <input class="inp" id="logSearch" placeholder="Hledat…" oninput="renderLog()">
    <button class="btn btn-outline btn-sm" onclick="exportLog()">📥</button>
    <button class="btn btn-outline btn-sm" onclick="if(confirm('Smazat vše?')){rides=[];saveRides(rides);renderAll();flash('Smazáno')}">🗑</button>
  </div>
  <div id="logList"></div>
</div>

<div id="printArea"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
var BASE_URL="https://raw.githack.com/dfwvhfnw7y-coder/Zku-ebn-j-zdy/main/index.html";
var SK="sw-td-v11";
function loadRides(){try{return JSON.parse(localStorage.getItem(SK))||[]}catch(e){return[]}}
function saveRides(r){try{localStorage.setItem(SK,JSON.stringify(r))}catch(e){}}
var rides=loadRides(),pendingConfirm=null,lastActiveCarId=null,scanMode=null,scanner=null;

function switchTab(id){
  var p=['Scan','Gen','Log'],t=['tabScan','tabGen','tabLog'],d=['scan','gen','log'];
  for(var i=0;i<3;i++){document.getElementById('panel'+p[i]).classList.remove('active');document.getElementById(t[i]).classList.remove('active')}
  var x=d.indexOf(id);document.getElementById('panel'+p[x]).classList.add('active');document.getElementById(t[x]).classList.add('active');
  if(id==='log')renderLog();
}
var tt=null;function flash(m,w){var t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(w?' warn':'');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2500)}

function showConfirm(type,value,info,btn){
  document.getElementById('cfIcon').textContent=type==='car'?'🚗':'👤';
  document.getElementById('cfLabel').textContent=type==='car'?'VOZIDLO':'ZÁKAZNÍK';
  document.getElementById('cfValue').textContent=value;
  document.getElementById('cfInfo').textContent=info||'';
  document.getElementById('cfOkBtn').textContent=btn||'Zapsat';
  pendingConfirm={type:type,value:value};
  document.getElementById('confirmOverlay').classList.add('show');
}
function hideConfirm(){document.getElementById('confirmOverlay').classList.remove('show');pendingConfirm=null}
function confirmAction(){if(!pendingConfirm)return;var t=pendingConfirm.type,v=pendingConfirm.value;hideConfirm();if(t==='car')handleCar(v);else handleCustomer(v)}

function getActiveRides(){var a=[];for(var i=0;i<rides.length;i++)if(!rides[i].end)a.push(rides[i]);return a}
function findRideById(id){for(var i=0;i<rides.length;i++)if(rides[i].id===id)return rides[i];return null}
function findActiveByCarName(n){var l=n.toLowerCase();for(var i=0;i<rides.length;i++)if(!rides[i].end&&rides[i].car.toLowerCase()===l)return rides[i];return null}
function findActiveRidesWithCustomer(n){var l=n.toLowerCase(),a=[];for(var i=0;i<rides.length;i++){if(rides[i].end)continue;for(var j=0;j<rides[i].customers.length;j++)if(rides[i].customers[j].toLowerCase()===l){a.push(rides[i]);break}}return a}

function handleCar(name){
  var ex=findActiveByCarName(name);
  if(ex){ex.end=new Date().toISOString();saveRides(rides);flash('🏁 Jízda ukončena: '+name);renderAll();return}
  var nr={id:Date.now(),car:name,start:new Date().toISOString(),end:null,customers:[]};
  rides.unshift(nr);lastActiveCarId=nr.id;saveRides(rides);flash('🚗 Nová jízda: '+name);renderAll();
}
function handleCustomer(name){
  var cr=findActiveRidesWithCustomer(name);
  if(cr.length>0){var now=new Date().toISOString();for(var i=0;i<cr.length;i++)cr[i].end=now;saveRides(rides);flash('🏁 Ukončeno: '+name);renderAll();return}
  var act=getActiveRides();if(!act.length){flash('⚠ Nejdřív naskenuj auto!',true);return}
  var tgt=null;if(lastActiveCarId){tgt=findRideById(lastActiveCarId);if(tgt&&tgt.end)tgt=null}
  if(!tgt)tgt=act[0];
  tgt.customers.push(name);lastActiveCarId=tgt.id;saveRides(rides);flash('👤 '+name+' → '+tgt.car);renderAll();
}
function endRide(id){var r=findRideById(id);if(r&&!r.end){r.end=new Date().toISOString();saveRides(rides);flash('🏁 '+r.car);renderAll()}}
function endAllRides(){var a=getActiveRides();if(!a.length)return;if(!confirm('Ukončit '+a.length+' jízd?'))return;var n=new Date().toISOString();for(var i=0;i<a.length;i++)a[i].end=n;saveRides(rides);flash('Vše ukončeno');renderAll()}
function manualAdd(){var c=document.getElementById('manualCar').value.trim(),u=document.getElementById('manualCust').value.trim();if(!c&&!u){flash('Zadej vůz/zákazníka',true);return}if(c){handleCar(c);document.getElementById('manualCar').value=''}if(u){handleCustomer(u);document.getElementById('manualCust').value=''}}

function parseQRData(data,mode){
  try{var u=new URL(data);var p=u.searchParams;if(p.get('car'))return{type:'car',value:p.get('car')};if(p.get('customer'))return{type:'customer',value:p.get('customer')}}catch(e){}
  return{type:mode,value:data};
}

function handleScanResult(decodedText){
  closeScan();
  var parsed=parseQRData(decodedText,scanMode);
  var info='',btn='Zapsat';
  if(parsed.type==='car'){
    var ex=findActiveByCarName(parsed.value);
    if(ex){info='Jízda bude UKONČENA';btn='Ukončit'}else{info='Nová jízda'}
  }else{
    var cr2=findActiveRidesWithCustomer(parsed.value);
    if(cr2.length>0){info='Jede v: '+cr2.map(function(r){return r.car}).join(', ')+' → UKONČIT';btn='Ukončit'}
    else{var a2=getActiveRides();if(!a2.length)info='⚠ Žádné aktivní auto';else{var tg=lastActiveCarId?findRideById(lastActiveCarId):null;if(!tg||tg.end)tg=a2[0];info='→ '+tg.car}}
  }
  showConfirm(parsed.type,parsed.value,info,btn);
}

/* ══════════════════════════════════════
   Html5QrcodeScanner — full UI from library
   Camera selection, permissions, scanning
   all handled by the library itself.
   ══════════════════════════════════════ */
function startScan(mode){
  scanMode=mode;
  document.getElementById('scanLabel').textContent=mode==='car'?'🚗 Skenuj QR vozidla':'👤 Skenuj QR zákazníka';
  document.getElementById('scanOverlay').classList.add('show');

  // Clear previous
  document.getElementById('scanReader').innerHTML='';

  scanner=new Html5QrcodeScanner("scanReader",{
    fps:10,
    qrbox:250,
    rememberLastUsedCamera:true,
    supportedScanTypes:[0], // 0 = SCAN_TYPE_CAMERA only
    showTorchButtonIfSupported:true,
    showZoomSliderIfSupported:true,
    defaultZoomValueIfSupported:2
  },/* verbose= */false);

  scanner.render(
    function onSuccess(decodedText,decodedResult){
      handleScanResult(decodedText);
    },
    function onError(errorMessage){
      // ignore continuous errors
    }
  );
}

function closeScan(){
  if(scanner){
    try{scanner.clear()}catch(e){}
    scanner=null;
  }
  document.getElementById('scanReader').innerHTML='';
  document.getElementById('scanOverlay').classList.remove('show');
  scanMode=null;
}

/* ── Render ── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtTime(i){if(!i)return'';return new Date(i).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}
function fmtDur(a,b){if(!a||!b)return'';var m=Math.round((new Date(b)-new Date(a))/60000);return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'min'}
function renderActive(){
  var a=getActiveRides(),el=document.getElementById('activeSection');
  if(!a.length){el.innerHTML='';return}
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px">🟢 Aktivní ('+a.length+')</h3>';
  if(a.length>1)h+='<button class="btn btn-red btn-sm" onclick="endAllRides()">Ukončit vše</button>';
  h+='</div>';
  for(var i=0;i<a.length;i++){var r=a[i];
    h+='<div class="active-card"><div class="top"><div class="car">'+esc(r.car)+'</div><button class="end-btn" onclick="endRide('+r.id+')">Ukončit</button></div>';
    h+='<div style="font-size:12px;color:var(--text2);margin:4px 0">Od '+fmtTime(r.start)+'</div>';
    if(r.customers.length){h+='<div class="customers">';for(var j=0;j<r.customers.length;j++)h+='<span>👤 '+esc(r.customers[j])+'</span> ';h+='</div>'}
    else h+='<div style="font-size:12px;color:var(--text2);font-style:italic">Žádný zákazník</div>';
    h+='<span class="active-tag">● PROBÍHÁ</span></div>';
  }
  el.innerHTML=h;
}
function renderLog(){
  var q=(document.getElementById('logSearch')?document.getElementById('logSearch').value:'').toLowerCase(),el=document.getElementById('logList'),f=[];
  for(var i=0;i<rides.length;i++){var r=rides[i];if(!q){f.push(r);continue}if(r.car.toLowerCase().indexOf(q)>=0){f.push(r);continue}for(var j=0;j<r.customers.length;j++)if(r.customers[j].toLowerCase().indexOf(q)>=0){f.push(r);break}}
  if(!f.length){el.innerHTML='<div class="empty"><div class="ico">📋</div><p>Žádné záznamy</p></div>';return}
  var h='';for(var i=0;i<f.length;i++){var r=f[i];h+='<div class="ride"><div class="top"><div class="car">'+esc(r.car)+'</div><div class="time">'+fmtTime(r.start)+'</div></div>';if(r.customers.length){h+='<div class="customers">';for(var j=0;j<r.customers.length;j++)h+='<span>👤 '+esc(r.customers[j])+'</span> ';h+='</div>'}h+=r.end?'<span class="dur">'+fmtDur(r.start,r.end)+'</span>':'<span class="active-tag">● PROBÍHÁ</span>';h+='</div>'}
  el.innerHTML=h;
}
function updateBadge(){var t=new Date().toDateString(),c=0;for(var i=0;i<rides.length;i++)if(new Date(rides[i].start).toDateString()===t)c++;document.getElementById('countBadge').textContent=c}
function renderAll(){renderActive();renderLog();updateBadge()}

function generateQR(type){
  var iid=type==='car'?'genCarInput':'genCustInput',cid=type==='car'?'qrCarContainer':'qrCustContainer',nid=type==='car'?'qrCarName':'qrCustName',oid=type==='car'?'qrCarOutput':'qrCustOutput';
  var val=document.getElementById(iid).value.trim();if(!val){flash('Zadej hodnotu',true);return}
  var url=BASE_URL+'?'+(type==='car'?'car':'customer')+'='+encodeURIComponent(val);
  var c=document.getElementById(cid);c.innerHTML='';
  new QRCode(c,{text:url,width:256,height:256,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
  document.getElementById(nid).textContent=(type==='car'?'🚗 ':'👤 ')+val;
  document.getElementById(oid).style.display='block';
}
function printQR(type){
  var cid=type==='car'?'qrCarContainer':'qrCustContainer',nid=type==='car'?'qrCarName':'qrCustName',lbl=type==='car'?'VOZIDLO':'ZÁKAZNÍK';
  var el=document.getElementById(cid),cv=el.querySelector('canvas'),im=el.querySelector('img');
  var src=cv?cv.toDataURL():im?im.src:null;if(!src)return;
  var name=document.getElementById(nid).textContent;
  document.getElementById('printArea').innerHTML='<div style="text-align:center;padding:40px;font-family:-apple-system,sans-serif"><div style="font-size:12px;color:#666;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px">'+lbl+'</div><img src="'+src+'" style="width:300px;height:300px"><div style="font-size:22px;font-weight:700;margin-top:12px">'+esc(name)+'</div><div style="font-size:11px;color:#999;margin-top:8px">S. &amp; W. Automobily s.r.o.</div></div>';
  window.print();
}
function exportLog(){
  if(!rides.length){flash('Žádná data',true);return}
  var csv='\uFEFF"Vozidlo";"Zákazníci";"Začátek";"Konec";"Trvání"\n';
  for(var i=0;i<rides.length;i++){var r=rides[i];csv+='"'+r.car+'";"'+r.customers.join(', ')+'";"'+fmtTime(r.start)+'";"'+(r.end?fmtTime(r.end):'probíhá')+'";"'+(r.end?fmtDur(r.start,r.end):'')+'";\n'}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='zkusebni-jizdy-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

function processURL(){
  var p=new URLSearchParams(location.search),car=p.get('car'),cust=p.get('customer');
  if(car||cust)history.replaceState(null,'',location.pathname);
  if(car){var ex=findActiveByCarName(car);showConfirm('car',car,ex?'Jízda bude UKONČENA':'Nová jízda',ex?'Ukončit':'Zapsat')}
  else if(cust){var cr=findActiveRidesWithCustomer(cust);if(cr.length)showConfirm('customer',cust,'Jede v: '+cr.map(function(r){return r.car}).join(', ')+' → UKONČIT','Ukončit');else{var a=getActiveRides();showConfirm('customer',cust,a.length?'→ '+a[0].car:'⚠ Žádné auto','Zapsat')}}
}

renderAll();processURL();
</script>
</body>
</html>
