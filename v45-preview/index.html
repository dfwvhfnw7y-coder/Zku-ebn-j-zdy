<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>V45 TEST — Zkušební jízdy</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050b0f;color:#eef5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#050b0f}.tag{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:10;padding:6px 9px;border:1px solid rgba(18,223,241,.35);border-radius:999px;background:rgba(5,14,18,.78);backdrop-filter:blur(8px);color:#bff8ff;font-size:9px;font-weight:800;letter-spacing:.08em;pointer-events:none}
</style>
</head>
<body>
<div class="tag">V45 TEST</div>
<iframe id="app" title="Zkušební jízdy V45 test" sandbox="allow-scripts allow-forms allow-modals allow-same-origin allow-camera"></iframe>
<script>
(function(){
  var branch='v45-test',repo='dfwvhfnw7y-coder/Zku-ebn-j-zdy';
  var raw='https://raw.githubusercontent.com/'+repo+'/'+branch+'/';
  var app=document.getElementById('app');
  fetch(raw+'index.html?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(html){
    /* A blob document does not reliably resolve stylesheet/script subresources from raw.githubusercontent.com.
       Rewrite every relative asset to an absolute raw URL before loading the snapshot. */
    html=html.replace(/(href|src)=(['"])(?!https?:|data:|blob:|#|\/\/)([^'"]+)\2/gi,function(_,attr,q,path){return attr+'='+q+raw+path+q});
    html=html.replace(/(['"])(css|js)\/([^'"]+\.css|[^'"]+\.js)(\?[^'"]*)?\1/gi,function(_,q,dir,file,query){return q+raw+dir+'/'+file+(query||'')+q});
    var blob=new Blob([html],{type:'text/html'});app.src=URL.createObjectURL(blob);
  }).catch(function(e){document.body.innerHTML='<div style="padding:32px;max-width:520px;margin:auto"><h2>V45 TEST</h2><p>Preview se nepodařilo načíst.</p><small>'+String(e)+'</small></div>'});
})();
</script>
</body>
</html>
