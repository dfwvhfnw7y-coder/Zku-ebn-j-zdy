<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>V45 TEST — Zkušební jízdy</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050b0f;color:#eef5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#050b0f}.tag{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:10;padding:6px 9px;border:1px solid rgba(18,223,241,.35);border-radius:999px;background:rgba(5,14,18,.78);backdrop-filter:blur(8px);color:#bff8ff;font-size:9px;font-weight:800;letter-spacing:.08em;pointer-events:none}
</style>
</head>
<body>
<div class="tag">V45 TEST</div>
<iframe id="app" title="Zkušební jízdy V45 test" allow="camera"></iframe>
<script>
(function(){
  var commit='c2f90eab344982cb19d19e1a83bd2a17fca09bea';
  var base='https://cdn.jsdelivr.net/gh/dfwvhfnw7y-coder/Zku-ebn-j-zdy@'+commit+'/';
  var app=document.getElementById('app');
  var css=['css/app.css','css/import.css','css/v44.css','css/v44-screens.css','css/v44-polish.css','css/v44-responsive.css','css/v44-fleet.css','css/v44-aux.css','css/v44-typography.css','css/v44-hero-image.css','css/v44-toast-fix.css','css/v45.css'];
  fetch(base+'index.html?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(html){
    var forced='<base href="'+base+'">'+css.map(function(x){return '<link rel="stylesheet" href="'+base+x+'?preview=45l">'}).join('');
    html=html.replace(/<head>/i,'<head>'+forced);
    app.srcdoc=html;
  }).catch(function(e){document.body.innerHTML='<div style="padding:32px;max-width:520px;margin:auto"><h2>V45 TEST</h2><p>Preview se nepodařilo načíst.</p><small>'+String(e)+'</small></div>'});
})();
</script>
</body>
</html>
